<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 28px;
        background: linear-gradient(135deg, #2E7D32 0%, #1B5E20 100%);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    /* Мягкое свечение, чтобы плашка не выглядела плоской заливкой */
    body::before {
        content: '';
        position: absolute;
        width: 900px;
        height: 900px;
        top: -420px;
        right: -260px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 70%);
    }

    .mark {
        width: 132px;
        height: 132px;
        fill: #fff;
        filter: drop-shadow(0 6px 18px rgba(0,0,0,0.25));
        position: relative;
    }

    .name {
        font-size: 82px;
        font-weight: 700;
        letter-spacing: -1.5px;
        position: relative;
    }

    .tagline {
        font-size: 33px;
        font-weight: 400;
        line-height: 1.35;
        max-width: 880px;
        color: rgba(255,255,255,0.92);
        position: relative;
    }

    .rule {
        width: 96px;
        height: 5px;
        border-radius: 3px;
        background: #FF8F00;
        position: relative;
    }
</style>
</head>
<body>
    <svg class="mark" viewBox="0 0 24 24">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
    </svg>
    <div class="name">Краевед.ру</div>
    <div class="rule"></div>
    <div class="tagline">Достопримечательности и природа<br>89 регионов России</div>
</body>
</html>
